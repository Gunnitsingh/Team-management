
services:
  api:
    build:
      context: .
      dockerfile: team-management-api/Dockerfile
    image: team-management-api:latest
    ports:
      - "8080:80"
    environment:
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: 5672
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=TeamManagementDb;User Id=sa;Password=${SA_PASSWORD:?Set SA_PASSWORD in .env};TrustServerCertificate=True;"
      Ollama__BaseUrl: http://host.docker.internal:11434
      Ollama__Model: llama3.1:8b
    depends_on:
      rabbitmq:
        condition: service_healthy
      sqlserver:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  worker:
    build:
      context: .
      dockerfile: TaskWorkerService/Dockerfile
    image: task-worker-service:latest
    environment:
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: 5672
      NotificationApi__BaseUrl: http://api
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=TeamManagementDb;User Id=sa;Password=${SA_PASSWORD:?Set SA_PASSWORD in .env};TrustServerCertificate=True;"
    depends_on:
      api:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      sqlserver:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:?Set SA_PASSWORD in .env}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

volumes:
  sqlserver-data:
